## 1.0 之后

1.0 开始冻结核心数据面。后续优先处理真实设备 / 真实网络暴露的问题，不为了版本号继续堆叠自动选节点或未经验证的“智能”功能。

RRBOX 不替用户猜测哪台 VPS 最适合某个业务；线路、IP 地区、目标服务和运营商差异应由用户掌握，客户端负责把选择稳定地执行。
''')

