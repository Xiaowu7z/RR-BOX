name: RRBOX 1.0.0 one-time finalizer

on:
  push:
    branches: ["dev"]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: run RRBOX 1.0.0 release cleanup' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply final repository cleanup
        run: python3 scripts/finalize_v1_release.py

      - name: Commit clean 1.0 repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize RRBOX 1.0.0 repository"
          git push origin HEAD:dev
