## 主要能力

- Android 8.0+ / arm64-v8a
- System / HEV 双转发引擎
- 中国大陆域名 / IP SRS 智能分流
- 全部代理 / 仅选中应用代理 / 选中应用绕过
- HTTP / HTTPS 订阅、IPv4 / IPv6 订阅地址
- 节点编辑、Ping、本地覆盖与本地节点管理
- VPN 连接时仅保护实际运行节点，其他本地节点仍可删除
- Network Lab：物理网络、MTU、DNS、IPv4/IPv6、TUN、自检、日志、A/B、恢复演练
- 自动脱敏日志
- 通知栏实时速率与连接时长
- Android Quick Settings 快捷开关
- App 内检查更新
- Obtainium 更新
- 可选 PIN 锁

