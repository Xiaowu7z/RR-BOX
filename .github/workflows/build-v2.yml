name: RR Client Automated Build (arm64-v8a)

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build RR Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RR-Android
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Sing-box libbox Core (v1.14.0 arm64-v8a)
        run: |
          mkdir -p app/libs
          
          # 克隆 sing-box 官方源码基线
          git clone https://github.com/SagerNet/sing-box.git --branch v1.14.0 --depth 1 sing-box-src
          cd sing-box-src
          
          # 使用官方内置工具构建 Android arm64 库
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 || true
          
          # 复制生成的 AAR 库
          find . -name "*.aar" -exec cp {} ../app/libs/libbox.aar \; || true
          cd ..

          # 自动保底机制：若环境差异导致未生成，自动拉取官方同版本 arm64-v8a 二进制
          if [ ! -f app/libs/libbox.aar ]; then
            echo "Using Official Sing-box v1.14.0 arm64 Release Core"
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.0 | grep -o 'https://[^"]*SFA-1.14.0-arm64-v8a.apk' | head -n 1 || echo "")
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -sSL -o sfa.apk "$DOWNLOAD_URL"
              unzip -q sfa.apk -d sfa_out
              mkdir -p app/src/main/jniLibs/arm64-v8a
              cp sfa_out/lib/arm64-v8a/libbox.so app/src/main/jniLibs/arm64-v8a/
            fi
          fi
          ls -lh app/libs/ || true

      - name: Setup Signing Keystore
        run: |
          echo "Generating Safe Isolated CI Keystore"
          keytool -genkeypair -v -keystore release.jks -alias rrclient -keyalg RSA -keysize 2048 -validity 10000 -storepass "rrclient_safe_ci" -keypass "rrclient_safe_ci" -dname "CN=RR Client, OU=RR, O=RR, L=Tokyo, C=JP"
          echo "RR_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
          echo "RR_KEYSTORE_PASS=rrclient_safe_ci" >> $GITHUB_ENV
          echo "RR_KEY_ALIAS=rrclient" >> $GITHUB_ENV
          echo "RR_KEY_PASS=rrclient_safe_ci" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          gradle clean :app:assembleRelease --stacktrace

      - name: Package Dist Artifacts & Generate Reports
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist/RR-Client-0.1.0-alpha-arm64-v8a.apk
          
          cd dist
          sha256sum RR-Client-0.1.0-alpha-arm64-v8a.apk > SHA256SUMS.txt
          
          cat << EOF > BUILD-REPORT.md
          # RR Client 0.1.0-alpha Build Report
          
          - **Package Name**: \`com.rr.client\`
          - **Version Name**: \`0.1.0-alpha\`
          - **ABI**: \`arm64-v8a\`
          - **Sing-box Core**: \`v1.14.0 (0b89958)\`
          - **Target Device**: \`OnePlus PLK110 / CPH2745 (Android 16)\`
          - **APK SHA-256**: \`$(awk '{print $1}' SHA256SUMS.txt)\`
          EOF
          cd ..

      - name: Upload APK & Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RR-Client-0.1.0-alpha-arm64-v8a
          path: dist/
