name: RRBOX Automated Build (arm64-v8a)

on:
  push:
    branches: ["main", "master", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrbox-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_TAG: v1.14.0
  SING_BOX_COMMIT: 0b8995879f29a9b98ee027bc17b75e101445b238
  GO_VERSION: 1.26.7
  NDK_VERSION: r28
  GRADLE_VERSION: 8.10.2
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  OUTPUT_APK_NAME: RRBOX-0.1.8-stability-arm64-v8a.apk

jobs:
  build:
    name: Build signed RRBOX APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout RR-Android
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.7
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Record toolchain versions
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p build-reports
          {
            echo "Git commit: $(git rev-parse HEAD)"
            java -version 2>&1
            go version
            gradle --version
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
            grep -F "Pkg.Revision" "${ANDROID_NDK_HOME}/source.properties"
          } | tee build-reports/TOOLCHAIN.txt

      - name: Download maintained China binary rule snapshots
        shell: bash
        run: |
          set -euo pipefail
          rules_dir="app/src/main/assets/rules"
          rm -rf "$rules_dir"
          mkdir -p "$rules_dir" build-reports

          validate_rule() {
            local file="$1"
            test "$(xxd -p -l 3 "$file")" = "535253"
            test "$(stat -c '%s' "$file")" -gt 8
            local version
            version="$(od -An -tu1 -j3 -N1 "$file" | tr -d ' ')"
            test -n "$version"
            test "$version" -ge 1
            test "$version" -le 5
          }

          fetch_rule() {
            local output="$1"
            shift
            local temp="${output}.tmp"
            rm -f "$temp"
            for url in "$@"; do
              if curl --fail --location --silent --show-error \
                --retry 3 --retry-delay 2 \
                --connect-timeout 15 --max-time 60 \
                "$url" -o "$temp"; then
                if validate_rule "$temp"; then
                  mv "$temp" "$output"
                  return 0
                fi
              fi
              rm -f "$temp"
            done
            echo "ERROR: unable to download sing-box 1.14-compatible SRS: $output" >&2
            return 1
          }

          fetch_rule "$rules_dir/geosite-geolocation-cn.srs" \
            "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs" \
            "https://testingcf.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-geolocation-cn.srs"

          fetch_rule "$rules_dir/geoip-cn.srs" \
            "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs" \
            "https://testingcf.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/geoip-cn.srs"

          sha256sum "$rules_dir"/*.srs | tee build-reports/CHINA-RULES-SHA256.txt
          ls -lh "$rules_dir"/*.srs | tee build-reports/CHINA-RULES-SIZES.txt
          test "$(find "$rules_dir" -maxdepth 1 -name '*.srs' | wc -l)" -eq 2

      - name: Build official sing-box libbox.aar
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          rm -rf sing-box-src
          rm -f app/libs/libbox.aar
          mkdir -p app/libs build-reports

          git clone \
            --branch "$SING_BOX_TAG" \
            --depth 1 \
            https://github.com/SagerNet/sing-box.git \
            sing-box-src

          cd sing-box-src

          actual_commit="$(git rev-parse HEAD)"
          echo "sing-box commit: ${actual_commit}" | tee ../build-reports/SING-BOX.txt
          test "$actual_commit" = "$SING_BOX_COMMIT"

          make lib_install

          grep -q 'with_gvisor' cmd/internal/build_libbox/main.go
          grep -q 'with_tailscale' cmd/internal/build_libbox/main.go
          grep -q 'with_naive_outbound' cmd/internal/build_libbox/main.go

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

          test -s libbox.aar
          cp -v libbox.aar ../app/libs/libbox.aar
          cd ..

          test -s app/libs/libbox.aar
          unzip -Z1 app/libs/libbox.aar | tee build-reports/LIBBOX-AAR-FILES.txt
          grep -q '^jni/arm64-v8a/libbox\.so$' build-reports/LIBBOX-AAR-FILES.txt

          if grep -Eq '^jni/(armeabi-v7a|x86|x86_64)/' build-reports/LIBBOX-AAR-FILES.txt; then
            echo "ERROR: libbox.aar contains an unexpected ABI" >&2
            exit 1
          fi

          sha256sum app/libs/libbox.aar | tee build-reports/LIBBOX-SHA256.txt
          ls -lh app/libs/libbox.aar

      - name: Validate signing secrets and restore keystore
        shell: bash
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
          RR_KEYSTORE_PASSWORD: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS_VALUE: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASSWORD_VALUE: ${{ secrets.RR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          : "${RR_KEYSTORE_BASE64:?Missing GitHub Secret: RR_KEYSTORE_BASE64}"
          : "${RR_KEYSTORE_PASSWORD:?Missing GitHub Secret: RR_KEYSTORE_PASSWORD}"
          : "${RR_KEY_ALIAS_VALUE:?Missing GitHub Secret: RR_KEY_ALIAS}"
          : "${RR_KEY_PASSWORD_VALUE:?Missing GitHub Secret: RR_KEY_PASSWORD}"

          keystore_path="$RUNNER_TEMP/rr-client-release.jks"
          printf '%s' "$RR_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$RR_KEYSTORE_PASSWORD" \
            -alias "$RR_KEY_ALIAS_VALUE" \
            >/dev/null

          echo "RR_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run regression tests and build signed Release APK
        shell: bash
        env:
          RR_KEYSTORE_PASS: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASS: ${{ secrets.RR_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          grep -q 'OsConstants.IFF_UP' app/src/main/java/com/rr/client/core/BoxServiceWrapper.kt
          grep -q 'buildInterfaceFlags' app/src/main/java/com/rr/client/core/BoxServiceWrapper.kt
          grep -q 'include_package' app/src/main/java/com/rr/client/core/ConfigBuilder.kt
          grep -q 'exclude_package' app/src/main/java/com/rr/client/core/ConfigBuilder.kt
          grep -q 'ACTION_RESTART_VPN' app/src/main/java/com/rr/client/vpn/NotificationManager.kt
          grep -q 'START_NOT_STICKY' app/src/main/java/com/rr/client/vpn/RRVpnService.kt
          if grep -q 'START_STICKY' app/src/main/java/com/rr/client/vpn/RRVpnService.kt; then
            echo "ERROR: sticky VPN restore path must not return" >&2
            exit 1
          fi
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'clearApplicationUserData' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' app/src/main/AndroidManifest.xml
          grep -q 'NodeLatencyTester' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'PROXY_SELECTED_PACKAGES' app/src/main/java/com/rr/client/storage/PreferencesManager.kt
          grep -q 'BYPASS_SELECTED_PACKAGES' app/src/main/java/com/rr/client/storage/PreferencesManager.kt
          grep -q 'PIN_MAX_FAILED_ATTEMPTS' app/src/main/java/com/rr/client/storage/PreferencesManager.kt
          grep -q 'RRBOX' app/src/main/res/values/strings.xml

          gradle \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            clean \
            :app:testReleaseUnitTest \
            :app:assembleRelease

      - name: Verify APK and generate reports
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"

          mkdir -p dist build-reports
          output_apk="dist/${OUTPUT_APK_NAME}"
          cp "$source_apk" "$output_apk"

          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          aapt2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          test -x "$apksigner"
          test -x "$aapt2"

          "$apksigner" verify \
            --verbose \
            --print-certs \
            "$output_apk" \
            | tee build-reports/SIGNATURE-REPORT.txt

          "$aapt2" dump badging "$output_apk" \
            | tee build-reports/PACKAGE-REPORT.txt

          grep -q "package: name='com.rr.client'" build-reports/PACKAGE-REPORT.txt
          grep -q "versionName='0.1.8-stability'" build-reports/PACKAGE-REPORT.txt
          grep -q "application-label:'RRBOX'" build-reports/PACKAGE-REPORT.txt

          unzip -Z1 "$output_apk" | tee build-reports/APK-FILE-LIST.txt
          grep -q '^lib/arm64-v8a/libbox\.so$' build-reports/APK-FILE-LIST.txt
          grep -q '^assets/rules/geosite-geolocation-cn\.srs$' build-reports/APK-FILE-LIST.txt
          grep -q '^assets/rules/geoip-cn\.srs$' build-reports/APK-FILE-LIST.txt
          if grep -q '^assets/rules/geosite-geolocation-not-cn\.srs$' build-reports/APK-FILE-LIST.txt; then
            echo "ERROR: obsolete not-cn rule is still packaged" >&2
            exit 1
          fi

          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' build-reports/APK-FILE-LIST.txt; then
            echo "ERROR: APK contains an unexpected ABI" >&2
            exit 1
          fi

          if grep -Eqi '(^|/)META-INF/xposed(/|$)|XposedProvider|SystemUI.*Hook' build-reports/APK-FILE-LIST.txt; then
            echo "ERROR: APK contains an unexpected Xposed/SystemUI module entry" >&2
            exit 1
          fi

          sha256sum "$output_apk" | tee dist/SHA256SUMS.txt

          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" build-reports/PACKAGE-REPORT.txt | head -n 1)"
          version_code="$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" build-reports/PACKAGE-REPORT.txt | head -n 1)"
          version_name="$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" build-reports/PACKAGE-REPORT.txt | head -n 1)"
          apk_sha256="$(awk '{print $1}' dist/SHA256SUMS.txt)"
          apk_size="$(stat -c '%s' "$output_apk")"
          certificate_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build-reports/SIGNATURE-REPORT.txt | head -n 1)"
          ndk_revision="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "${ANDROID_NDK_HOME}/source.properties" | head -n 1)"

          cat > dist/BUILD-REPORT.md <<EOF
          # RRBOX 0.1.8-stability Build Report

          - Source commit: $(git rev-parse HEAD)
          - Package name: ${package_name}
          - Version code: ${version_code}
          - Version name: ${version_name}
          - App label: RRBOX
          - ABI: arm64-v8a only
          - sing-box tag: ${SING_BOX_TAG}
          - sing-box commit: ${SING_BOX_COMMIT}
          - Go: $(go version)
          - JDK: $(java -version 2>&1 | head -n 1)
          - Android SDK platform: ${ANDROID_PLATFORM}
          - Android build tools: ${ANDROID_BUILD_TOOLS}
          - Android NDK: ${ndk_revision}
          - Gradle: $(gradle --version | awk '/^Gradle / {print $2; exit}')
          - APK file: ${OUTPUT_APK_NAME}
          - APK size: ${apk_size} bytes
          - APK SHA-256: ${apk_sha256}
          - Signing certificate SHA-256: ${certificate_sha256}
          - VPN lifecycle: deterministic START_NOT_STICKY, no stale runtime restore
          - Per-app filtering: authoritative sing-box TUN include/exclude package fields
          - Proxy-only and bypass app lists: persisted independently
          - Smart routing: SagerNet China geosite + geoip binary rules
          - Rule updater: atomic runtime replacement with sing-box 1.14 version validation
          - Notification actions: restart + disconnect
          - PIN lock: PBKDF2 credential + configurable failed-attempt self-wipe policy
          - R8/minification: disabled for alpha
          - SystemUI/Xposed module: not included
          - CI verification: unit tests, SRS assets, signature, app label, package, version and ABI passed

          Real-device validation remains required for node connectivity, per-app behavior, UI stability and throughput.
          EOF

          cp build-reports/SIGNATURE-REPORT.txt dist/
          cp build-reports/PACKAGE-REPORT.txt dist/
          cp build-reports/LIBBOX-SHA256.txt dist/
          cp build-reports/CHINA-RULES-SHA256.txt dist/
          cp build-reports/CHINA-RULES-SIZES.txt dist/
          cp build-reports/TOOLCHAIN.txt dist/

      - name: Upload APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: RRBOX-0.1.8-stability-arm64-v8a
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
