name: RR Client Automated Build (arm64-v8a)

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build RR Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RR-Android
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Sing-box libbox.aar (v1.14.0 arm64-v8a)
        run: |
          mkdir -p app/libs
          
          # 克隆 sing-box v1.14.0 官方源码
          git clone https://github.com/SagerNet/sing-box.git --branch v1.14.0 --depth 1 sing-box-src
          cd sing-box-src
          
          # 核心修复：剔除导致底层冲突的 with_gvisor 标签，确保顺利编译
          sed -i 's/with_gvisor,//g' cmd/internal/build_libbox/main.go || true
          sed -i 's/with_gvisor//g' cmd/internal/build_libbox/main.go || true
          
          # 执行官方构建命令
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          
          # 复制生成的 AAR 核心库到 app/libs/ 供项目引用
          cp -v libbox.aar ../app/libs/ || find . -name "*.aar" -exec cp -v {} ../app/libs/ \;
          cd ..
          
          ls -lh app/libs/

      - name: Setup Signing Keystore
        run: |
          echo "Generating Safe Isolated CI Keystore"
          keytool -genkeypair -v -keystore release.jks -alias rrclient -keyalg RSA -keysize 2048 -validity 10000 -storepass "rrclient_safe_ci" -keypass "rrclient_safe_ci" -dname "CN=RR Client, OU=RR, O=RR, L=Tokyo, C=JP"
          echo "RR_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
          echo "RR_KEYSTORE_PASS=rrclient_safe_ci" >> $GITHUB_ENV
          echo "RR_KEY_ALIAS=rrclient" >> $GITHUB_ENV
          echo "RR_KEY_PASS=rrclient_safe_ci" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          gradle clean :app:assembleRelease --stacktrace

      - name: Package Dist Artifacts & Generate Reports
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist/RR-Client-0.1.0-alpha-arm64-v8a.apk
          
          cd dist
          sha256sum RR-Client-0.1.0-alpha-arm64-v8a.apk > SHA256SUMS.txt
          
          cat << EOF > BUILD-REPORT.md
          # RR Client 0.1.0-alpha Build Report
          
          - **Package Name**: \`com.rr.client\`
          - **Version Name**: \`0.1.0-alpha\`
          - **ABI**: \`arm64-v8a\`
          - **Sing-box Core**: \`v1.14.0 (0b89958)\`
          - **Target Device**: \`OnePlus PLK110 / CPH2745 (Android 16)\`
          - **APK SHA-256**: \`$(awk '{print $1}' SHA256SUMS.txt)\`
          EOF
          cd ..

      - name: Upload APK & Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RR-Client-0.1.0-alpha-arm64-v8a
          path: dist/
