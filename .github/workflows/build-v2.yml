name: RRBOX 1.0.1 Build & Release (arm64-v8a)

on:
  push:
    branches: ["main", "dev", "audit/stable-1.0.0", "audit/stable-1.0.1", "feat/domestic-routing-wechat-douyin"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rrbox-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_TAG: v1.14.0
  SING_BOX_COMMIT: 0b8995879f29a9b98ee027bc17b75e101445b238
  HEV_COMMIT: 64cc609f945253b0e9ebc56317d544268f3c68c1
  GO_VERSION: 1.26.7
  NDK_VERSION: r28
  GRADLE_VERSION: 8.10.2
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  VERSION_CODE: "101"
  VERSION_NAME: "1.0.1"
  OUTPUT_APK_NAME: RRBOX-1.0.1-arm64-v8a.apk

jobs:
  build:
    name: Test, lint and sign RRBOX 1.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Source inventory and regressions
        run: |
          python3 scripts/source_audit.py
          bash scripts/source-regressions.sh
          python3 scripts/verify-root-command-compat.py
          python3 scripts/test-rule-publishing.py
          git diff --check
      - name: Verify Root helper in isolated host network
        run: |
          set -euo pipefail
          mkdir -p build-reports
          real_ip="$(command -v ip)"
          cat > build-reports/android-compatible-ip <<EOF
          #!/bin/sh
          for argument in "\$@"; do
            if [ "\$argument" = '-N' ]; then
              echo 'Android ip compatibility: -N is unsupported' >&2
              exit 255
            fi
          done
          exec "$real_ip" "\$@"
          EOF
          chmod 755 build-reports/android-compatible-ip
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            "-DRRBOX_IP_PATH=\"$PWD/build-reports/android-compatible-ip\"" native/root_engine.c -o build-reports/root-engine-host
          sudo unshare --net -- python3 scripts/verify-root-engine.py \
            --helper "$PWD/build-reports/root-engine-host" --report "$PWD/build-reports/ROOT-ENGINE-REPORT.json"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Download and verify China binary rules
        run: bash scripts/ci-fetch-rules.sh
      - name: Build pinned sing-box libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/ci-build-libbox.sh
      - name: Build pinned HEV native TUN engine
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/ci-build-hev.sh
      - name: Build isolated Root capability probe
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/ci-build-root-probe.sh
      - name: Build Root TUN and UID routing supervisor
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/ci-build-root-engine.sh
      - name: Restore existing release signing key
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
          RR_KEYSTORE_PASSWORD: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS_VALUE: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASSWORD_VALUE: ${{ secrets.RR_KEY_PASSWORD }}
        run: bash scripts/ci-restore-signing.sh
      - name: All Release unit tests, Android Lint and signed APK
        env:
          RR_KEYSTORE_PASS: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASS: ${{ secrets.RR_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=2 --stacktrace clean :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Build pinned host core for routing verification
        working-directory: sing-box-src
        run: |
          test "$(git rev-parse HEAD)" = "$SING_BOX_COMMIT"
          go build -ldflags "-X github.com/sagernet/sing-box/constant.Version=${SING_BOX_TAG#v}" -o ../build-reports/sing-box-routing-check ./cmd/sing-box
      - name: Verify Root TCP and UDP return paths without Linux main fallback
        run: |
          set -euo pipefail
          test "$(git -C sing-box-src rev-parse HEAD)" = "$SING_BOX_COMMIT"
          mkdir -p sing-box-src/cmd/rrbox-root-tcp-check
          cp scripts/root-tcp-check/main.go sing-box-src/cmd/rrbox-root-tcp-check/main.go
          cd sing-box-src
          go build -o ../build-reports/root-tcp-stack-check ./cmd/rrbox-root-tcp-check
          cd ..
          sudo unshare --net -- python3 scripts/verify-root-tcp.py \
            --helper "$PWD/build-reports/root-engine-host" --stack "$PWD/build-reports/root-tcp-stack-check" \
            --report "$PWD/build-reports/ROOT-TCP-REPORT.json"
      - name: Verify domestic and overseas routing with real core
        run: python3 scripts/verify-routing.py --sing-box build-reports/sing-box-routing-check --fixtures app/build/routing-fixtures --report build-reports/ROUTING-CORE-REPORT.json
      - name: Verify stale X destinations and QUIC reply addresses with real core
        run: |
          go build -o build-reports/routing-quic-fixture scripts/routing-quic-fixture/main.go
          python3 scripts/verify-destination-recovery.py --sing-box build-reports/sing-box-routing-check --quic-generator build-reports/routing-quic-fixture --fixtures app/build/routing-fixtures --report build-reports/DESTINATION-RECOVERY-REPORT.json
      - name: Verify HEV DNS and reverse mapping with real core
        run: python3 scripts/verify-hev-dns.py --sing-box build-reports/sing-box-routing-check --fixtures app/build/hev-dns-fixtures --report build-reports/HEV-DNS-REPORT.json
      - name: Verify WeChat TCP IPv6 recovery and unchanged UDP with real core
        run: |
          sudo unshare --net -- sh -eu <<'SH'
          ip link set lo up
          exec python3 scripts/verify-wechat-ipv6.py --sing-box build-reports/sing-box-routing-check --quic-generator build-reports/routing-quic-fixture --fixtures app/build/routing-fixtures --report build-reports/WECHAT-IPV6-REPORT.json
          SH
      - name: Verify native HEV DNS packet forwarding
        run: |
          test "$(git -C hev-socks5-tunnel rev-parse HEAD)" = "$HEV_COMMIT"
          make -C hev-socks5-tunnel -j2 shared CFLAGS=-Wno-error=unused-result
          python3 scripts/verify-hev-native-dns.py --hev-library hev-socks5-tunnel/bin/libhev-socks5-tunnel.so --fixtures app/build/hev-dns-fixtures --report build-reports/HEV-NATIVE-DNS-REPORT.json
      - name: Verify APK, signer continuity and test reports
        run: bash scripts/ci-verify-apk.sh
      - name: Publish signed rules and advance manual update channel
        if: "${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/domestic-routing-wechat-douyin' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RR_KEYSTORE_PASS: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASS: ${{ secrets.RR_KEY_PASSWORD }}
        run: python3 scripts/publish-rule-bundle.py
      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: RRBOX-1.0.1-arm64-v8a
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Create stable tag at tested source without moving prior releases
        if: "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: RRBOX 1.0.1') }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" --jq .object.sha > "$RUNNER_TEMP/rrbox-stable-tag-sha"; then
            test "$(cat "$RUNNER_TEMP/rrbox-stable-tag-sha")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.0.1" -f sha="$GITHUB_SHA"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Publish audited RRBOX 1.0.1 stable release
        if: "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: RRBOX 1.0.1') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: RRBOX 1.0.1 正式版
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/RRBOX-1.0.1-arm64-v8a.apk
            dist/SHA256SUMS.txt
            dist/BUILD-REPORT.md
            dist/SIGNATURE-REPORT.txt
            dist/PACKAGE-REPORT.txt
            dist/TEST-REPORT.json
            dist/SOURCE-AUDIT.json
            dist/ROUTING-CORE-REPORT.json
            dist/DESTINATION-RECOVERY-REPORT.json
            dist/WECHAT-IPV6-REPORT.json
            dist/HEV-DNS-REPORT.json
            dist/HEV-NATIVE-DNS-REPORT.json
            dist/ROOT-ENGINE-REPORT.json
            dist/ROOT-TCP-REPORT.json
            dist/obtainium.json
      - name: Verify published APK digest and update channel
        if: "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: RRBOX 1.0.1') }}"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json"
            if python3 - <<'PY'
          import json, os, pathlib
          release=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'latest.json').read_text())
          assert release['tag_name']=='v1.0.1' and not release['draft'] and not release['prerelease']
          assets=[a for a in release['assets'] if a['name']==os.environ['OUTPUT_APK_NAME']]
          assert len(assets)==1 and assets[0]['state']=='uploaded'
          digest=pathlib.Path('dist/SHA256SUMS.txt').read_text().split()[0]
          assert assets[0]['digest']=='sha256:'+digest
          assert assets[0]['size']==pathlib.Path('dist',os.environ['OUTPUT_APK_NAME']).stat().st_size
          assert json.loads(pathlib.Path('obtainium.json').read_text())['url']=='https://github.com/Xiaowu7z/RR-BOX'
          PY
            then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Upload full diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RRBOX-audit-reports-${{ github.run_id }}
          path: |
            build-reports/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
