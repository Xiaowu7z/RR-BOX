name: Stable source audit snapshot
on:
  push:
    branches: ["audit/stable-1.0.0"]
    paths: [".github/workflows/review-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate tracked sources and collect audit inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-input/deps
          git archive --format=zip HEAD -o audit-input/source.zip
          git ls-files | tee audit-input/inventory.txt
          git diff --check
          python3 - <<'PY'
          import pathlib, json, xml.etree.ElementTree as ET
          for p in pathlib.Path('app/src').rglob('*.xml'):
              ET.parse(p)
          json.loads(pathlib.Path('obtainium.json').read_text())
          PY
          bash -n scripts/generate_keystore.sh
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o audit-input/deps/junit.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o audit-input/deps/hamcrest.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar -o audit-input/deps/gson.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/yaml/snakeyaml/2.3/snakeyaml-2.3.jar -o audit-input/deps/snakeyaml.jar
          sha256sum audit-input/source.zip audit-input/deps/*.jar > audit-input/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stable-audit-input
          path: audit-input/
          retention-days: 7
          if-no-files-found: error
