name: Apply RRBOX 1.0.0 Bugfix Batch

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/apply-rrbox-bugfixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev

      - name: Apply requested fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_rrbox_bugfixes.py
          git diff --check
          grep -q 'looksLikeSubscriptionAddress' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'onImportClipboard = ::importClipboardContent' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'onRenameNode = ::renameNode' app/src/main/java/com/rr/client/MainActivity.kt
          grep -q 'Text("重命名")' app/src/main/java/com/rr/client/ui/screens/NodeListScreen.kt
          grep -q 'val submittedUrl = urlInput.trim()' app/src/main/java/com/rr/client/ui/screens/SubscriptionScreen.kt
          grep -q 'versionCode = 100' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts

      - name: Try to fill GitHub repository description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f description='Android 原生代理客户端 · System/HEV 双数据面 · 移动网络连续性守护 · 可复现构建'
          status=$?
          set -e
          echo "repository-description-update-status=$status"
          exit 0

      - name: Commit bugfix batch to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/rr/client/MainActivity.kt app/src/main/java/com/rr/client/subscription/SubscriptionUrlNormalizer.kt app/src/main/java/com/rr/client/ui/screens/NodeListScreen.kt app/src/main/java/com/rr/client/ui/screens/SubscriptionScreen.kt app/src/test/java/com/rr/client/subscription/SubscriptionUrlNormalizerTest.kt
          git commit -m "fix: clipboard subscriptions, node rename and clean add form"
          git push origin HEAD:dev
