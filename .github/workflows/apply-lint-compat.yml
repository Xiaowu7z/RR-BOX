name: Apply Android compatibility fixes
on:
  push:
    branches: ["audit/lint-compat-1.0.0"]
    paths: [".github/workflows/apply-lint-compat.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='14a1bd6a955315d579a697abf3c787729129b0880f3b4e84f898c0de1f94f2e7'
          pathlib.Path('/tmp/rrbox-lint.patch').write_bytes(patch)
          PY
          git apply --check /tmp/rrbox-lint.patch
          git apply /tmp/rrbox-lint.patch
          git diff --check
          python3 scripts/source_audit.py
          bash scripts/source-regressions.sh
      - name: Commit exact fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs/CODE-AUDIT.md SECURITY.md CHANGELOG.md
          git commit -m 'fix: Android API compatibility and local-only data policy'
          git push origin HEAD:audit/lint-compat-1.0.0
