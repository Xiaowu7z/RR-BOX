name: Apply reviewed stable audit patch
on:
  push:
    branches: ["audit/stable-1.0.0"]
    paths: [".github/workflows/apply-audit.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify and apply reviewed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/audit.xz"
          : > "$archive"
          for sha in fdf8e8f9f2acfd9223a280c780f39ee359ddfc94 feb8f653ecac6b9133cec9b9f62caa017bd43d4b 29b9a63d57a33d0cfa2d06548d20b0b7b62c261a b27ae12a342b34a99791834281f7db51014a20da; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$archive"
          done
          python3 - <<'PY'
          import hashlib,lzma,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          patch=lzma.decompress((temp/'audit.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '84a9457f6b1971b2907632db9e5b33b391812e5e0f0dcbaefb556d4ec3fd0217'
          (temp/'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git diff --check
          python3 scripts/source_audit.py
          bash scripts/source-regressions.sh
      - name: Commit reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts docs README.md CHANGELOG.md SECURITY.md THIRD_PARTY_NOTICES.md .gitignore .github/repository-metadata.json
          git commit -m 'fix: complete stable source audit and regression coverage'
          git push origin HEAD:audit/stable-1.0.0
